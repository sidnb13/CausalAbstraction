[project]
name = "causal-abstraction"
version = "0.1.0"
description = "Causal Abstraction for Mechanistic Interpretability"
authors = [
    { name = "MIB Team" }
]
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
keywords = [
    "causal-abstraction",
    "mechanistic-interpretability",
    "neural-networks",
    "causal-models",
    "interchange-interventions",
    "PyTorch",
]
classifiers = [
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.0.0",
    "networkx>=3.0",
    "sae_lens>=5.10.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyvene>=0.1.0",
    "scikit-learn>=1.3.0",
    "ipywidgets>=8.0.0",
    "jupyterlab>=4.0.0",
    "ipycytoscape>=1.3.0",
    "seaborn>=0.13.0",
    "transformers>=4.38.0",
    "tensorboard"
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.7.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
test = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/mechanistic-interpretability-benchmark/mib"
Repository = "https://github.com/mechanistic-interpretability-benchmark/mib"
Documentation = "https://github.com/mechanistic-interpretability-benchmark/mib"
"Bug Tracker" = "https://github.com/mechanistic-interpretability-benchmark/mib/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["causal_abstraction"]

# Dependency overrides to fix Python 3.13 compatibility issues
[tool.uv.dependency-overrides]
"zstandard" = ">=0.23.0"
"cffi" = ">=1.16.0"

[tool.ruff.lint]
exclude = ["*.ipynb", "tests/", "demos/"]
ignore = ["E203", "E501", "E731", "F722", "E741", "F821", "F403", "ARG002"]
select = ["UP", "TID", "I", "F", "E", "ARG", "SIM", "RET", "LOG", "T20"]

[tool.ruff.lint.per-file-ignores]
"demos/*" = ["T20"]
"tests/*" = ["T20"]

